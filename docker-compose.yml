services:
  db:
    image: mysql:8.4
    container_name: agentflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password_change_me
      MYSQL_DATABASE: agentflow
      MYSQL_USER: agentflow
      MYSQL_PASSWORD: agentflow_dev_password
    ports:
      - "3306:3306"
    volumes:
      - agentflow_data:/var/lib/mysql
      - ./apps/api/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_password_change_me"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  agentflow_data:
